org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Service directories of Gradle and Kotlin, kept inside output.
org.gradle.projectcachedir=output/gradle
kotlin.project.persistent.dir=output/kotlin
# The problems report would go to build\ in the project root, outside output; the warnings stay in the build log.
org.gradle.problems.report=false

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
